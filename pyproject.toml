[project]
name = "capacity-guardian"
version = "0.1.0"
description = "Autonomous email triage agent for an AI dev agency at capacity."
requires-python = ">=3.11"
dependencies = [
    "google-api-python-client",
    "google-auth-oauthlib",
    "google-auth",
    "gspread",
    "requests",
    "python-dotenv",
    "rich",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent*"]
